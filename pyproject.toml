# FILE: pyproject.toml
[project]
name = "reporadar"
version = "1.0.0"
description = "A practical GitHub repository health and launch-readiness auditor built with Django."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PandaDev", email = "admin@thepandadev.com" }]
dependencies = [
  "Django>=5.1,<6.0",
  "httpx>=0.27,<1.0",
  "dj-database-url>=2.2,<3.0",
  "whitenoise>=6.7,<7.0",
  "python-dotenv>=1.0,<2.0",
  "gunicorn>=23.0,<24.0",
  "psycopg[binary]>=3.2,<4.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.9", "ruff>=0.6"]
[tool.uv]
package = false
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# END OF FILE
# SIGNED: admin@thepandadev.com
