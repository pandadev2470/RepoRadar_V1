# FILE: render.yaml
services:
  - type: web
    name: reporadar
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: reporadar-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: reporadar-db
    plan: free
    databaseName: reporadar
    user: reporadar

